name: Update Cat Fact

on:
  schedule:
    - cron: "0 8 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cat-fact:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get random cat fact
        run: |
          FACT=$(curl -s https://catfact.ninja/fact | python3 -c "import sys, json; print(json.load(sys.stdin)['fact'])")
          echo "CAT_FACT=$FACT" >> "$GITHUB_ENV"

      - name: Update README
        run: |
          python3 <<'PY'
          import os
          import re

          fact = os.environ["CAT_FACT"]

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          replacement = f"""<!-- CAT_FACT_START -->
          > 🐾 {fact}
          <!-- CAT_FACT_END -->"""

          readme = re.sub(
              r"<!-- CAT_FACT_START -->.*?<!-- CAT_FACT_END -->",
              replacement,
              readme,
              flags=re.DOTALL
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme)
          PY

      - name: Commit updated fact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update daily cat fact"
            git push
          fi
